site_name: stoke
site_description: Build, run, and scaffold projects in multiple languages
site_url: https://dvdsvds.github.io/stoke/
repo_url: https://github.com/dvdsvds/stoke
repo_name: dvdsvds/stoke

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: ko
          name: 한국어
          build: true

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - Commands:
    - Overview: commands/overview.md
    - build: commands/build.md
    - run: commands/run.md
    - watch: commands/watch.md
    - hot-reload: commands/hot-reload.md
    - clean: commands/clean.md
    - init: commands/init.md
    - ide-sync: commands/ide-sync.md
  - Languages:
    - Python: languages/python.md
    - Java: languages/java.md
    - C/C++: languages/cpp.md
    - Go: languages/go.md
    - Rust: languages/rust.md
    - Kotlin: languages/kotlin.md
    - C#: languages/csharp.md
    - Ruby: languages/ruby.md
    - PHP: languages/php.md
    - JavaScript: languages/javascript.md
    - TypeScript: languages/typescript.md
  - Configuration:
    - stoke.toml: configuration/stoke-toml.md
    - Profiles: configuration/profiles.md
    - Lock file: configuration/lock-file.md
  - Advanced:
    - vcpkg: advanced/vcpkg.md
    - IDE Integration: advanced/ide-integration.md
  - Frameworks:
    - Overview: frameworks/overview.md
    - Java:
      - Spring Boot: frameworks/spring-boot.md
    - Python:
      - FastAPI: frameworks/fastapi.md
      - Flask: frameworks/flask.md
      - Django: frameworks/django.md
    - Go:
      - Gin: frameworks/gin.md
      - Echo: frameworks/echo.md
      - Fiber: frameworks/fiber.md
      - Chi: frameworks/chi.md
    - JavaScript:
      - Express: frameworks/express.md
      - Fastify: frameworks/fastify.md
    - TypeScript:
      - Next.js: frameworks/nextjs.md
      - NestJS: frameworks/nestjs.md
      - Vite: frameworks/vite.md
      - Nuxt: frameworks/nuxt.md
      - SvelteKit: frameworks/sveltekit.md
      - Hono: frameworks/hono.md
    - Rust:
      - Actix-web: frameworks/actix-web.md
      - Axum: frameworks/axum.md
      - Rocket: frameworks/rocket.md
    - Kotlin:
      - Ktor: frameworks/ktor.md
      - Spring Boot (Kotlin): frameworks/spring-boot-kotlin.md
    - C#:
      - ASP.NET Core: frameworks/aspnet-core.md
    - Ruby:
      - Sinatra: frameworks/sinatra.md
    - PHP:
      - Slim: frameworks/slim.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true